<style>
:root{--sky:#8ecbf2;--sky2:#d9eefc;--ink:#1f3a5f;--cream:#fff8e7;--yellow:#ffd54a;--coral:#ff8a80;--mint:#9be3c1;--white:#fff;
--head:'Baloo 2','Trebuchet MS',sans-serif;--body:'Nunito','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);font-size:18px;line-height:1.55;color:var(--ink);background:var(--sky);
background-image:radial-gradient(circle at 12% 18%,#fff8 0 60px,transparent 62px),radial-gradient(circle at 88% 82%,#fff6 0 90px,transparent 92px);overflow:hidden;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--head);line-height:1.1}
button,a.btn{font:inherit;cursor:pointer;border:0;text-decoration:none}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.btn{display:inline-block;background:var(--yellow);color:var(--ink);font-family:var(--head);font-weight:800;font-size:1.15rem;padding:.7rem 1.6rem;border-radius:999px;box-shadow:0 5px 0 #d9a800,0 10px 18px #1f3a5f33;transition:transform .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d9a800}
.btn.alt{background:var(--white);box-shadow:0 5px 0 #b9d6ea,0 10px 18px #1f3a5f22}
.btn.msg{background:#0a7cff;color:#fff;box-shadow:0 5px 0 #0657b3,0 10px 18px #1f3a5f33;font-size:1.4rem;padding:.9rem 2rem}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding:12px;perspective:1800px}
/* COVER */
#bookwrap{position:relative;width:min(560px,100%);height:min(86vh,760px);transition:width .8s}
#bookwrap.open{width:min(980px,100%)}
.cover{position:absolute;inset:0;z-index:5;border-radius:12px 28px 28px 12px;background:linear-gradient(160deg,#5eb1e8,#3b8fd0);color:#fff;text-align:center;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 24px;transform-origin:left center;
box-shadow:inset 14px 0 0 #2b75b3,0 25px 50px #1f3a5f55;transition:transform 1s cubic-bezier(.6,0,.2,1),opacity .4s .7s;cursor:pointer;overflow:hidden}
.cover.opening{transform:rotateY(-130deg);opacity:0;pointer-events:none}
.cover .frame{position:absolute;inset:16px 16px 16px 30px;border:3px dashed #ffffff99;border-radius:20px;pointer-events:none}
.cover h1{font-size:clamp(3rem,12vw,5rem);color:var(--yellow);text-shadow:0 4px 0 #2b75b3;letter-spacing:.02em}
.cover .tag{font-family:var(--head);font-size:clamp(1.3rem,4.5vw,1.8rem);font-weight:600;max-width:20ch}
.cover .sub{background:#fff;color:var(--ink);border-radius:16px;padding:.5rem 1rem;font-weight:800;font-size:.95rem;max-width:30ch}
.cover .deco{position:absolute;font-size:2.2rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(8deg)}}
/* READER */
#reader{position:absolute;inset:0;display:none;flex-direction:column;background:var(--cream);border-radius:12px 28px 28px 12px;box-shadow:0 25px 50px #1f3a5f55,inset 10px 0 18px -8px #1f3a5f33;overflow:hidden}
#reader.show{display:flex}
#bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--sky2)}
#bar button{background:#fff;color:var(--ink);font-weight:800;border-radius:999px;padding:.4rem 1rem;min-height:44px;box-shadow:0 3px 0 #b9d6ea}
#pg{font-family:var(--head);font-weight:800}
#pages{position:relative;flex:1;perspective:1600px;overflow:hidden}
.page{position:absolute;inset:0;display:none;overflow-y:auto;padding:22px clamp(18px,5vw,56px) 28px;background:var(--cream);-webkit-overflow-scrolling:touch}
.page.active{display:block;animation:inR .55s ease both;transform-origin:left center}
.page.active.back{animation-name:inL;transform-origin:right center}
.page.leaving{display:block;animation:outR .3s ease forwards;transform-origin:left center;z-index:2}
.page.leaving.back{animation-name:outL;transform-origin:right center}
@keyframes inR{from{transform:rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes inL{from{transform:rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes outR{to{transform:rotateY(-70deg);opacity:0}}
@keyframes outL{to{transform:rotateY(70deg);opacity:0}}
.page h2{font-size:clamp(2rem,6vw,3rem);color:#2b75b3;margin-bottom:.3em}
.page p{max-width:62ch;margin-bottom:.8em}
.page .big{font-family:var(--head);font-size:1.4rem;background:var(--yellow);border-radius:20px;padding:.8rem 1.1rem;box-shadow:0 5px 0 #d9a800;display:inline-block;margin:.6rem 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
@media(max-width:700px){.two{grid-template-columns:1fr}body{font-size:17px}}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.badge{background:#fff;border:3px solid var(--sky);border-radius:999px;padding:.35rem 1rem;font-weight:800}
.art{display:flex;justify-content:center}
.art svg,.art img{max-width:100%;max-height:320px;border-radius:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 var(--sky2),0 10px 20px #1f3a5f14;border-top:8px solid var(--c,var(--sky))}
.card h3{font-size:1.3rem;margin-bottom:.4em}
.card ul,.list{padding-left:1.2em}
.card li,.list li{margin:.15em 0}
.list{list-style:none;padding:0}
.list li{background:#fff;border-radius:16px;padding:.55rem .9rem;margin:.5rem 0;box-shadow:0 3px 0 var(--sky2);display:flex;gap:10px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tab{background:#fff;color:var(--ink);border-radius:999px;padding:.5rem 1rem;font-weight:800;min-height:44px;box-shadow:0 3px 0 var(--sky2)}
.tab[aria-selected=true]{background:var(--sky);box-shadow:0 3px 0 #5eb1e8}
.sample{background:#fff;border-radius:24px;padding:18px;border:3px dashed var(--sky);margin-top:8px}
.sample .lab{display:inline-block;background:var(--coral);color:#fff;font-weight:800;border-radius:999px;padding:.1rem .8rem;font-size:.85rem;margin-bottom:8px}
.q{font-family:var(--head);font-size:1.6rem;margin:.3rem 0 .8rem}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:var(--sky2);color:var(--ink);font-weight:800;font-size:1.2rem;border-radius:16px;padding:.6rem 1.3rem;min-height:48px;box-shadow:0 4px 0 #b9d6ea}
.opt.ok{background:var(--mint)}.opt.no{background:#ffd0cc}
.fb{min-height:1.8em;font-weight:800;margin-top:.7rem}
.contact{background:#fff;border-radius:22px;padding:14px 18px;margin:.8rem 0;box-shadow:0 4px 0 var(--sky2)}
.contact b{display:block}
.final{font-family:var(--head);font-size:1.6rem;text-align:center;margin-top:1.2rem;color:#2b75b3}
#foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--sky2);gap:8px}
#foot .btn{padding:.45rem 1.3rem;font-size:1.05rem;min-height:46px}
#foot .btn[disabled]{opacity:.4;pointer-events:none}
#dots{display:flex;gap:8px}
#dots i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--sky)}
#dots i.on{background:var(--yellow);border-color:#d9a800;transform:scale(1.3)}
#toc{position:absolute;inset:0;z-index:10;background:#1f3a5fcc;display:none;align-items:center;justify-content:center;padding:20px;border-radius:inherit}
#toc.show{display:flex}
#toc nav{background:var(--cream);border-radius:28px;padding:22px;width:min(420px,100%)}
#toc h3{font-size:1.8rem;margin-bottom:.5rem;color:#2b75b3}
#toc button.item{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);font-weight:800;border-radius:16px;padding:.7rem 1rem;margin:.4rem 0;min-height:48px;box-shadow:0 3px 0 var(--sky2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app">
 <div id="bookwrap">

<script>
/* =====================================================================
   EDIT HERE – everything parents will read lives in this CONFIG block
   ===================================================================== */
const CONFIG = {
  name: "Teacher Tian",
  tagline: "Your Child's Learning Journey Starts Here!",
  tagline2: "Learn. Grow. Excel.",

  // CONTACT – replace these. Do not leave "YOUR_" in the final version.

  messengerLink: "https://www.facebook.com/share/19d6CkkM6k/",
  facebookLink: "https://www.facebook.com/share/19d6CkkM6k/",
  contact: {
    phone: "09158704360",
    email: "garvida03232698@gmail.com",
    location: "Pagudpud, Ilocos Norte",
    schedule: ["Monday–Tuesday: 8:00 AM – 2:00 PM", "Wednesday–Friday: 8:00 AM – 12:00 PM", "Saturday–Sunday: 8:00 AM – 12:00 PM and 1:00 PM – 5:00 PM"]

  ],
  badges: ["🎓 Licensed Professional Teacher (LPT)", "📘 MAEd Student", "⭐ 5 Years of Mixed Tutoring and Classroom Teaching Experience"],

  services: [
    { icon: "🎒", color: "#8ecbf2", title: "Elementary All Subjects (Grades 1–6)", items: ["English", "Filipino", "Mathematics", "Science", "Other elementary subjects"] },
    { icon: "📖", color: "#ffd54a", title: "Reading and Literacy", items: ["Reading comprehension", "Vocabulary development", "Phonics and word recognition", "Reading fluency"] },
    { icon: "➕", color: "#9be3c1", title: "Numeracy and Mathematics", items: ["Number sense", "Basic operations", "Fractions", "Problem-solving", "Other elementary math skills"] },
    { icon: "🏡", color: "#ff8a80", title: "Homeschool Support", items: ["Personalized learning activities", "Guided lessons", "Practice worksheets", "Learning progress monitoring"] }
  ],

  approach: ["🪜 Patient and step-by-step explanations", "🎯 Lessons adjusted to the child's learning needs", "🖍️ Visual aids and interactive activities", "🍎 Practical examples", "🌟 Encouragement and positive reinforcement", "📝 Regular practice and progress monitoring"],

  parents: ["💙 Personalized learning support", "🧩 Lessons suited to their child's needs", "✏️ Regular practice activities", "🤗 Encouraging and supportive instruction", "💬 Communication about learning progress"],
  parentsMessage: "Your child's learning journey is a partnership. Let's work together to help them build confidence and reach their full potential.",

  modes: ["💻 Online tutoring", "🏠 Face-to-face tutoring"]
};

/* Sample activities for Page 4 (clearly labelled as samples). Edit freely. */
const SAMPLES = {
  math:    { tab: "➕ Math",      q: "What is 3/4 + 1/4 ?", opts: ["1", "4/8", "3/8"], a: 0, tip: "Same bottom number? Just add the tops!" },
  reading: { tab: "📖 Reading",   q: "Which word rhymes with “cat”?", opts: ["bat", "dog", "sun"], a: 0, tip: "Say them out loud: cat, bat… hear the match?" },
  filipino:{ tab: "🇵🇭 Filipino", q: "Kasingkahulugan ng “masaya”?", opts: ["lungkot", "ligaya", "galit"], a: 1, tip: "Isipin ang pakiramdam kapag may handaan!" },
  english: { tab: "✏️ English",   q: "She ___ to school every day.", opts: ["go", "goes", "going"], a: 1, tip: "“She” goes with the verb that ends in -es." },
  game:    { tab: "🎮 Game",      q: "Count the stars: ⭐⭐⭐⭐⭐⭐⭐", opts: ["6", "7", "8"], a: 1, tip: "Point to each star as you count." }
};

/* =====================================================================
   BOOK ENGINE – you normally do not need to edit below this line
   ===================================================================== */
const C = CONFIG, $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const li = a => a.map(x => `<li>${esc(x)}</li>`).join('');

const teacherArt = () => C.images.teacher ? `<img src="${esc(C.images.teacher)}" alt="${esc(C.name)}" loading="lazy">` :
`<svg viewBox="0 0 300 300" role="img" aria-label="Friendly cartoon teacher">
<rect width="300" height="300" rx="40" fill="#d9eefc"/><rect x="20" y="30" width="110" height="70" rx="8" fill="#fff" stroke="#8ecbf2" stroke-width="4"/>
<text x="75" y="76" font-size="34" text-anchor="middle" font-family="Baloo 2,sans-serif" fill="#1f3a5f">A B C</text>
<path d="M60 300c0-60 40-90 90-90s90 30 90 90z" fill="#8ecbf2"/><rect x="132" y="190" width="36" height="30" fill="#ffd9b8"/>
<circle cx="150" cy="150" r="58" fill="#ffd9b8"/><path d="M90 150c-6-60 40-84 76-76 36 4 56 34 44 76-8-30-30-44-60-44s-50 14-60 44z" fill="#4a2f27"/>
<circle cx="128" cy="154" r="22" fill="none" stroke="#1f3a5f" stroke-width="4"/><circle cx="172" cy="154" r="22" fill="none" stroke="#1f3a5f" stroke-width="4"/><path d="M150 154h0" stroke="#1f3a5f" stroke-width="4"/>
<circle cx="128" cy="154" r="6" fill="#1f3a5f"/><circle cx="172" cy="154" r="6" fill="#1f3a5f"/>
<path d="M126 182q24 22 48 0" fill="none" stroke="#c0504d" stroke-width="5" stroke-linecap="round"/>
<circle cx="108" cy="178" r="8" fill="#ff8a80" opacity=".6"/><circle cx="192" cy="178" r="8" fill="#ff8a80" opacity=".6"/>
<text x="245" y="70" font-size="34">⭐</text><text x="235" y="270" font-size="34">📚</text><text x="20" y="270" font-size="34">✏️</text></svg>`;

const pages = [
 { title: "Meet Teacher Tian", html: () => `
  <div class="two"><div><h2>${esc(C.introTitle)}</h2>${C.intro.map(p=>`<p>${esc(p)}</p>`).join('')}
  <div class="badges">${C.badges.map(b=>`<span class="badge">${esc(b)}</span>`).join('')}</div></div><div class="art">${teacherArt()}</div></div>` },

 { title: "What Your Child Will Learn", html: () => `<h2>Learning Made Fun and Meaningful!</h2>
  <div class="cards">${C.services.map(s=>`<div class="card" style="--c:${s.color}"><h3>${s.icon} ${esc(s.title)}</h3><ul>${li(s.items)}</ul></div>`).join('')}</div>` },

 { title: "How I Teach", html: () => `<h2>Every Child Can Learn!</h2>
  <p><b>“Every child learns at a different pace. My goal is to make learning easier, enjoyable, and meaningful for every learner.”</b></p>
  <div class="two"><ul class="list">${C.approach.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <div class="art"><svg viewBox="0 0 300 220" role="img" aria-label="Teacher helping children read and solve problems"><rect width="300" height="220" rx="30" fill="#d9eefc"/>
  <text x="20" y="100" font-size="64">👩‍🏫</text><text x="110" y="100" font-size="52">🧒</text><text x="180" y="100" font-size="52">👧</text>
  <text x="30" y="180" font-size="44">📖</text><text x="100" y="180" font-size="44">➗</text><text x="170" y="180" font-size="44">🧮</text><text x="235" y="180" font-size="44">💡</text></svg></div></div>
  <div class="big">I don't just want children to memorize answers. I want them to understand WHY and HOW.</div>` },

 { title: "Learning Experience", html: () => `<h2>Let's Learn Together!</h2><p>Tap a sample to try it. These are sample activities only.</p>
  <div class="tabs" role="tablist">${Object.keys(SAMPLES).map((k,i)=>`<button class="tab" role="tab" data-k="${k}" aria-selected="${i==0}">${SAMPLES[k].tab}</button>`).join('')}</div>
  <div class="sample" id="sample"></div>` },

 { title: "For Parents", html: () => `<h2>Your Child's Progress Matters!</h2><p>Here is what you can expect when learning with me:</p>
  <ul class="list">${C.parents.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="big">${esc(C.parentsMessage)}</div>` },

 { title: "Let's Get Started", html: () => `<h2>Ready to Start Your Child's Learning Journey?</h2><p><b>Looking for an elementary tutor? I'd be happy to help!</b></p>
  <p><a class="btn msg" data-link="messengerLink" href="${esc(C.messengerLink)}" target="_blank" rel="noopener">💬 Message me on Messenger</a></p>
  <p><a class="btn alt" data-link="facebookLink" href="${esc(C.facebookLink)}" target="_blank" rel="noopener">👍 Visit my Facebook page</a></p>
  <div class="badges">${C.modes.map(m=>`<span class="badge">${esc(m)}</span>`).join('')}</div>
  <div class="contact"><b>📞 Phone</b>${esc(C.contact.phone)}<b>✉️ Email</b>${esc(C.contact.email)}<b>📍 Location</b>${esc(C.contact.location)}<b>🕒 Available Schedule</b>${[].concat(C.contact.schedule).map(esc).join('<br>')}</div>
  <div class="final">${esc(C.finalTagline)}</div>` }
];

let cur = 0, pageEls = [];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove('show'),2800)}

function build(){
  $('#cName').textContent = C.name.toUpperCase(); $('#cTag').textContent = C.tagline; $('#cSub').textContent = C.coverLine;
  $('#pages').innerHTML = pages.map((p,i)=>`<section class="page" id="p${i}" aria-label="Page ${i+1}: ${esc(p.title)}">${p.html()}</section>`).join('');
  pageEls = [...document.querySelectorAll('.page')];
  $('#dots').innerHTML = pages.map(()=>'<i></i>').join('');
  $('#tocList').innerHTML = `<button class="item" data-go="-1">🏠 Cover</button>` + pages.map((p,i)=>`<button class="item" data-go="${i}">Page ${i+1} · ${esc(p.title)}</button>`).join('');
  showSample('math');
}

function go(n, instant){
  n = Math.max(0, Math.min(pages.length-1, n));
  const back = n < cur, old = pageEls[cur];
  if (n !== cur && !instant){
    old.classList.remove('active','back'); old.classList.add('leaving'); if(back) old.classList.add('back');
    setTimeout(()=>old.classList.remove('leaving','back'), 300);
  } else if (n !== cur) old.classList.remove('active');
  cur = n; const el = pageEls[n]; el.classList.remove('leaving');
  el.classList.toggle('back', back); el.classList.add('active'); el.scrollTop = 0;
  $('#pg').textContent = `Page ${n+1} of ${pages.length}`;
  $('#prev').disabled = n === 0; $('#next').disabled = n === pages.length-1;
  [...$('#dots').children].forEach((d,i)=>d.classList.toggle('on', i===n));
  $('#toc').classList.remove('show');
  try{ history.replaceState(null,'','#page'+(n+1)) }catch(e){}
}

function openBook(){
  const c = $('#cover'); if (c.classList.contains('opening')) return;
  c.classList.add('opening'); $('#bookwrap').classList.add('open'); $('#reader').classList.add('show');
  const m = /#page(\d)/.exec(location.hash); cur = 0; go(m ? +m[1]-1 : 0, true);
  setTimeout(()=>{ c.style.display='none'; }, 1100);
}
function closeBook(){
  const c = $('#cover'); c.style.display=''; void c.offsetWidth;
  $('#bookwrap').classList.remove('open'); c.classList.remove('opening');
  setTimeout(()=>$('#reader').classList.remove('show'), 600);
  $('#toc').classList.remove('show');
  try{ history.replaceState(null,'',location.pathname) }catch(e){}
}

function showSample(k){
  const s = SAMPLES[k]; document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.k===k));
  $('#sample').innerHTML = `<span class="lab">SAMPLE ACTIVITY</span><div class="q">${esc(s.q)}</div>
   <div class="opts">${s.opts.map((o,i)=>`<button class="opt" data-i="${i}" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="fb" aria-live="polite"></div>`;
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button,a'); if(!t) return;
  if (t.id==='openBtn') { e.stopPropagation(); openBook(); }
  else if (t.id==='home') closeBook();
  else if (t.id==='prev') go(cur-1);
  else if (t.id==='next') go(cur+1);
  else if (t.id==='menu') $('#toc').classList.add('show');
  else if (t.id==='closeToc') $('#toc').classList.remove('show');
  else if (t.dataset.go !== undefined){ +t.dataset.go < 0 ? closeBook() : go(+t.dataset.go); }
  else if (t.classList.contains('tab')) showSample(t.dataset.k);
  else if (t.classList.contains('opt')){
    const s = SAMPLES[t.dataset.k], ok = +t.dataset.i === s.a, fb = $('#sample .fb');
    t.classList.add(ok?'ok':'no');
    fb.textContent = ok ? '🎉 Great job! You got it!' : '💪 Nice try! Hint: ' + s.tip;
    if (ok) document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  }
  else if (t.dataset.link && /YOUR_/.test(C[t.dataset.link])){ e.preventDefault(); toast('Add your real link in the CONFIG section of index.html'); }
});
$('#cover').addEventListener('click', openBook);
$('#cover').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openBook(); } });
document.addEventListener('keydown', e=>{
  if (!$('#reader').classList.contains('show')) return;
  if (e.key==='ArrowRight') go(cur+1); else if (e.key==='ArrowLeft') go(cur-1); else if (e.key==='Escape') $('#toc').classList.remove('show');
});
/* swipe */
let sx=0, sy=0;
$('#pages').addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
$('#pages').addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if (Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.5) go(cur + (dx<0?1:-1));
}, {passive:true});

build();
</script>
</body>
</html>
